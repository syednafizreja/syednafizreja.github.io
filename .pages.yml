# Pages CMS (https://pagescms.org) dashboard for this site. Every save is a commit; the deploy workflow rebuilds the site.
media:
  input: src/assets/media
  output: ../../assets/media

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{fields.short_title}.mdx"
    format: yaml-frontmatter
    view:
      fields: [number, title, status, year]
      primary: title
      sort: [number]
    fields:
      - { name: number, label: "Number (three digits, e.g. 007)", type: string, required: true, pattern: "^\d{3}$" }
      - { name: title, label: Title, type: string, required: true }
      - { name: short_title, label: Short title, type: string, required: true }
      - { name: year, label: "Year (e.g. 2026 or 2026–)", type: string, required: true }
      - { name: sort_date, label: Sort date, type: date, required: true }
      - name: status
        label: Status
        type: select
        options: { values: [in-progress, complete, archived] }
      - { name: summary, label: "Summary (max 300 characters)", type: text, required: true }
      - name: methods
        label: Methods
        type: select
        list: true
        options:
          values: [form-finding, seismic-analysis, embodied-carbon, finite-element, constitutive-mechanics, optimisation, validation, life-cycle-assessment, machine-learning, sciml-uq, hand-calculation, interactive-tools, durability-modelling]
      - { name: tools, label: Tools, type: string, list: true }
      - name: hero
        label: Hero image
        type: object
        fields:
          - { name: src, label: Image, type: image }
          - { name: alt, label: "Alt text (describe what the figure shows)", type: string }
          - { name: caption, label: Caption, type: text }
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - { name: src, label: Image, type: image }
          - { name: alt, label: Alt text, type: string }
          - { name: caption, label: Caption, type: text }
      - name: key_numbers
        label: Key numbers (only numbers from the repo or paper)
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
          - { name: unit, label: Unit, type: string }
          - { name: basis, label: Basis or source, type: string }
      - { name: numbers_note, label: Note under the numbers, type: text }
      - name: validation
        label: Validation
        type: object
        fields:
          - { name: benchmark, label: Benchmark, type: string }
          - { name: metric, label: Metric, type: string }
          - { name: value, label: Value, type: string }
      - name: evidence
        label: Evidence
        type: object
        fields:
          - { name: repo, label: Repository URL, type: string }
          - { name: tag, label: Release tag, type: string }
          - { name: doi, label: "DOI (without https://doi.org/)", type: string }
          - { name: report, label: Report URL, type: string }
          - { name: live, label: Live tool URL, type: string }
          - { name: tests, label: Tests, type: string }
          - { name: licence, label: Licence, type: string }
      - name: exhibit
        label: "Exhibit image (optional calculated figure)"
        type: object
        fields:
          - { name: src, label: Image, type: image }
          - { name: alt, label: "Alt text (at least ten characters)", type: string }
      - name: brief
        label: "Card brief"
        type: object
        fields:
          - { name: finding, label: "Method", type: text }
          - { name: limit, label: "Result, including trade-offs", type: text }
          - { name: next, label: "Open limit", type: text }
      - name: card_links
        label: "Card links"
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: URL, type: string }
      - { name: related, label: "Related projects (file names without .mdx)", type: string, list: true }
      - { name: draft, label: Draft (hidden from the site), type: boolean, default: false }
      - { name: body, label: "Case study (Method, Key result, Open limit)", type: rich-text }

  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    format: yaml
    view:
      fields: [order, title, status]
      primary: title
      sort: [order]
    fields:
      - { name: order, label: "Order (number in the list)", type: number }
      - { name: title, label: Title, type: string, required: true }
      - { name: authors, label: "Authors (e.g. Hasib, S. N. R.)", type: string, list: true }
      - { name: owner_index, label: "Your position in the author list (1 = first)", type: number }
      - name: type
        label: Type
        type: select
        options: { values: [journal, manuscript, report] }
      - name: status
        label: Status
        type: select
        options: { values: [published, submitted, under-review, with-editor, in-preparation, preprint] }
      - { name: venue, label: Journal or venue, type: string }
      - { name: year, label: Year, type: number }
      - { name: volume, label: Volume, type: string }
      - { name: issue, label: Issue, type: string }
      - { name: pages, label: Pages, type: string }
      - { name: doi, label: "DOI (without https://doi.org/)", type: string }
      - { name: url, label: "PDF or record URL", type: string }
      - { name: when, label: "Display date (e.g. Nov 2026)", type: string }
      - { name: manuscript_id, label: "Manuscript ID", type: string }
      - { name: code, label: "Code URL", type: string }
      - { name: scope, label: "Verification record", type: text }
      - { name: bibtex, label: "BibTeX override (optional)", type: text }
      - { name: note, label: Note, type: string }
      - { name: project, label: "Linked project (file name without .mdx)", type: string }

  - name: about
    label: About page
    type: file
    path: src/content/pages/about.mdx
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }
      - { name: body, label: Text, type: rich-text }

  - name: research
    label: Research statement
    type: file
    path: src/content/pages/research.mdx
    format: yaml-frontmatter
    fields:
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }
      - { name: body, label: Text, type: rich-text }

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Name, type: string }
      - { name: short_name, label: Short name, type: string }
      - { name: job_title, label: Job title, type: string }
      - { name: identity, label: One-line identity, type: text }
      - { name: bio, label: Short bio, type: text }
      - { name: currently, label: "Now line", type: string }
      - { name: location, label: "Location (region only, never a street address)", type: string }
      - { name: email_user, label: "Email user (before the @)", type: string }
      - { name: email_domain, label: Email domain, type: string }
      - { name: orcid, label: ORCID iD, type: string }
      - { name: github, label: GitHub username, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: researchgate, label: ResearchGate URL, type: string }
      - { name: cv_pdf, label: CV PDF path, type: string }
      - { name: accent, label: Accent, type: string }

  - name: home
    label: Homepage
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: sections
        label: "Section order and visibility"
        type: object
        list: true
        fields:
          - name: id
            label: Section
            type: select
            options: { values: [hero, map, work, method, outputs, tools, about] }
          - { name: enabled, label: Enabled, type: boolean }
      - { name: featured, label: "Featured project ids, in order", type: string, list: true }
      - { name: publicationLimit, label: "How many publications on the homepage", type: number }
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: kicker, label: Kicker, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: focus, label: "Research focus (keep the meaning exact)", type: text }
          - name: primary
            label: Primary action
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: Link, type: string }
          - name: secondary
            label: Secondary action
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: Link, type: string }
          - name: tertiary
            label: Third action
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: Link, type: string }
      - name: map
        label: Research map
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: question, label: Connecting question, type: text }
          - name: directions
            label: Directions
            type: object
            list: true
            fields:
              - { name: id, label: Id, type: string }
              - { name: index, label: Index, type: string }
              - { name: title, label: Title, type: string }
              - { name: summary, label: Summary, type: text }
              - { name: points, label: Points, type: string, list: true }
              - { name: project, label: "Project id", type: string }
              - name: diagram
                label: Diagram
                type: select
                options: { values: [hysteresis, shell] }
      - name: work
        label: Selected work
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: lede, label: Lede, type: text }
      - name: method
        label: Method
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: text }
          - name: steps
            label: Steps
            type: object
            list: true
            fields:
              - { name: id, label: Id, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
      - name: outputs
        label: Outputs
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: lede, label: Lede, type: text }
      - name: tools
        label: Tools
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: lede, label: Lede, type: text }
          - { name: ids, label: "Project ids", type: string, list: true }
      - name: about
        label: About band
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: lines, label: "Extra lines", type: text, list: true }
